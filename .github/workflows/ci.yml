name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    services:
      s3mock:
        image: ${{ matrix.os == 'ubuntu-latest' && 'adobe/s3mock:5.2.0' || '' }}
        ports:
          - 9090:9090
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: zarr-test-bucket
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Test
        env:
          RUN_S3_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
        run: go test ./...
      - name: Vet
        run: go vet ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Python interop
        run: |
          uv venv --python python3
          uv pip install zarr zstandard
          go test ./... -count=1

  cblosc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Install c-blosc
        run: sudo apt-get update && sudo apt-get install -y libblosc-dev pkg-config
      - name: Test with cblosc
        run: go test -tags cblosc ./...
